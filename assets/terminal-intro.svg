<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">Harshith Kumar terminal introduction</title>
<desc id="desc">Terminal-style profile card with basic information about Harshith Kumar, CSE AI and machine learning student.</desc>
<defs>
