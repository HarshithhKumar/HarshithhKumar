<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">Developer workspace illustration</title>
<desc id="desc">A person coding at a desk beside tall windows, with a plant and warm desk lighting, in a dark navy and teal editorial style.</desc>
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1524"/><stop offset="1" stop-color="#182b40"/></linearGradient>
 <linearGradient id="window" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162b43"/><stop offset="1" stop-color="#3a5d79"/></linearGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#533d35"/><stop offset="1" stop-color="#1b202b"/></linearGradient>
 <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdc99"/><stop offset="1" stop-color="#d58b54"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#f6b76d" stop-opacity=".42"/><stop offset="1" stop-color="#f6b76d" stop-opacity="0"/></radialGradient>
 <pattern id="lines" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H14" stroke="#9bbbd0" stroke-opacity=".16" stroke-width="2"/></pattern>
</defs>
<rect width="720" height="900" rx="24" fill="#0b101b"/>
<rect x="22" y="22" width="676" height="856" rx="16" fill="url(#wall)" stroke="#294158"/>
<circle cx="510" cy="485" r="245" fill="url(#glow)"/>
